<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Finance Deal Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --secondary: #10b981;
            --accent: #f59e0b;
            --danger: #ef4444;
            --light: #f9fafb;
            --light-2: #f3f4f6;
            --light-3: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-light: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,50 Q300,0 600,50 T1200,50 L1200,120 L0,120 Z" fill="rgba(255,255,255,0.1)"/></svg>') no-repeat bottom;
            background-size: cover;
            opacity: 0.1;
        }

        header .container {
            position: relative;
            z-index: 1;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.15rem;
            opacity: 0.95;
            font-weight: 400;
        }

        /* DEAL CONTAINER */
        .deal-container {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            padding: 50px;
            margin: -40px 20px 40px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .deal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid var(--light-3);
            flex-wrap: wrap;
            gap: 20px;
        }

        .deal-id {
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            color: var(--primary);
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #93c5fd;
        }

        /* SECTION */
        .section {
            margin-bottom: 45px;
        }

        .section:last-of-type {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        /* BUYER SECTION */
        .buyer-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1px solid #7dd3fc;
            border-radius: 12px;
            padding: 28px;
            transition: all 0.3s ease;
        }

        .buyer-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .buyer-name {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .buyer-detail {
            display: flex;
            align-items: center;
            padding: 12px 0;
            gap: 12px;
        }

        .buyer-detail-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 100px;
        }

        .buyer-detail-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* INFO GRID */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }

        .info-card {
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 22px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-light), var(--secondary));
        }

        .info-card:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .info-value {
            font-size: 1.25rem;
            color: var(--text-primary);
            font-weight: 700;
            word-break: break-word;
        }

        .info-value.currency {
            color: var(--secondary);
            background: linear-gradient(135deg, var(--secondary), #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* BUTTON SECTION */
        .button-section {
            display: flex;
            gap: 15px;
            margin-top: 50px;
            justify-content: center;
            flex-wrap: wrap;
            padding-top: 30px;
            border-top: 2px solid var(--light-3);
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-explain {
            background: linear-gradient(135deg, var(--secondary), #059669);
            color: white;
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
            min-width: 280px;
            justify-content: center;
            font-size: 1.1rem;
        }

        .btn-explain:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.4);
        }

        .btn-explain:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status-message {
            margin-top: 25px;
            padding: 16px 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.3s ease-out;
            font-weight: 500;
            border-left: 4px solid;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #ecfdf5;
            color: #065f46;
            border-left-color: var(--secondary);
        }

        .status-message.error {
            background: #fef2f2;
            color: #991b1b;
            border-left-color: var(--danger);
        }

        .status-message.info {
            background: #eff6ff;
            color: #0c2d6b;
            border-left-color: var(--primary);
        }

        /* EXPLANATION SECTION */
        .explanation-section {
            display: none;
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            padding: 50px;
            margin-top: 40px;
            margin-bottom: 40px;
            animation: slideUp 0.6s ease-out;
        }

        .explanation-section.show {
            display: block;
        }

        .explanation-title {
            font-size: 1.8rem;
            color: var(--text-primary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 700;
        }

        .explanation-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .explanation-content {
            line-height: 1.9;
            color: var(--text-primary);
        }

        .explanation-content h3 {
            color: var(--primary);
            margin-top: 28px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .explanation-content p {
            margin-bottom: 16px;
            color: var(--text-secondary);
        }

        .explanation-content ul {
            margin-left: 24px;
            margin-bottom: 16px;
        }

        .explanation-content li {
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .explanation-content strong {
            color: var(--secondary);
            font-weight: 700;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            border-top: 1px solid var(--border-light);
            margin-top: 60px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--primary-dark);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .deal-container {
                padding: 30px 20px;
                margin: -30px 10px 30px;
            }

            .deal-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .btn {
                min-width: 100%;
            }

            .btn-explain {
                min-width: 100%;
            }

            .explanation-section {
                padding: 30px 20px;
            }

            .section-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 Deal Structure</h1>
            <p class="subtitle">Review your auto financing deal</p>
        </header>

        <div class="deal-container">
            <div class="deal-id" id="dealId"></div>

            <!-- Buyer Information -->
            <div class="section">
                <div class="section-title">👤 Buyer Information</div>
                <div id="buyerInfo"></div>
            </div>

            <!-- Vehicle Information -->
            <div class="section">
                <div class="section-title">🚗 Vehicle Details</div>
                <div class="info-grid" id="vehicleInfo"></div>
            </div>

            <!-- Finance Terms -->
            <div class="section">
                <div class="section-title">💰 Finance Terms</div>
                <div class="info-grid" id="financeInfo"></div>
            </div>

            <!-- Protection Products -->
            <div class="section" id="productsSection" style="display: none;">
                <div class="section-title">🛡️ Protection Products</div>
                <div id="productsInfo"></div>
            </div>

            <!-- Action Buttons -->
            <div class="button-section">
                <button class="btn btn-explain" id="explainBtn" onclick="explainDeal()">
                    <span class="loading-spinner" id="spinner"></span>
                    <span id="btnText">✨ Explain My Deal</span>
                </button>
            </div>

            <!-- Status Message -->
            <div class="status-message" id="statusMessage"></div>
        </div>

        <!-- Explanation Section -->
        <div class="explanation-section" id="explanationSection">
            <div class="explanation-title">📖 AI-Generated Explanation</div>
            <div class="explanation-content" id="explanationContent"></div>
        </div>

        <footer>
            <p>&copy; 2026 Deal Structure Analyzer | Powered by AWS Bedrock</p>
        </footer>
    </div>

    <script>
        // Configuration - Update these with your API details
        const config = {
            apiEndpoint: localStorage.getItem('apiEndpoint') || 'https://YOUR_API_ID.execute-api.us-east-1.amazonaws.com/prod',
            s3Bucket: localStorage.getItem('s3Bucket') || 'deal-structure-bucket-xxx',
            dealJsonPath: localStorage.getItem('dealJsonPath') || '../deal.json'
        };

        // Load and display deal data on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, attempting to fetch deal data from:', config.dealJsonPath);
            loadAndDisplayDeal();
        });

        async function loadAndDisplayDeal() {
            try {
                console.log('Fetching deal data...');
                const response = await fetch(config.dealJsonPath);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const dealData = await response.json();
                console.log('Deal data loaded successfully:', dealData);
                displayDealData(dealData);
            } catch (error) {
                console.error('Error loading deal data:', error);
                showStatus(`Error loading deal data: ${error.message}. Make sure deal.json is in the correct location or set dealJsonPath in localStorage.`, 'error');
            }
        }

        function displayDealData(dealData) {
            const deal = dealData.deal;
            const header = dealData.header;

            console.log('Displaying deal data...');

            // Display Deal ID
            document.getElementById('dealId').textContent = `Deal ID: ${header.documentID} | Status: ${deal.dealStatus}`;

            // Display Buyer Information
            if (deal.parties && deal.parties.length > 0) {
                const buyer = deal.parties[0];
                const buyerName = `${buyer.personName.givenName} ${buyer.personName.familyName}`;
                const buyerHtml = `
                    <div class="party-info">
                        <div class="party-name">${buyerName}</div>
                        <div class="party-detail"><strong>Role:</strong> ${buyer.role}</div>
                        <div class="party-detail"><strong>Email:</strong> ${buyer.contact.email}</div>
                        <div class="party-detail"><strong>Phone:</strong> ${buyer.contact.phone}</div>
                    </div>
                `;
                document.getElementById('buyerInfo').innerHTML = buyerHtml;
                console.log('Buyer info displayed');
            }

            // Display Vehicle Information
            if (deal.vehicle) {
                const vehicle = deal.vehicle;
                const vehicleHtml = `
                    <div class="info-card">
                        <div class="info-label">Vehicle</div>
                        <div class="info-value">${vehicle.modelYear} ${vehicle.make} ${vehicle.model}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">VIN</div>
                        <div class="info-value">${vehicle.vin}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Stock Number</div>
                        <div class="info-value">${vehicle.stockNumber || 'N/A'}</div>
                    </div>
                `;
                document.getElementById('vehicleInfo').innerHTML = vehicleHtml;
                console.log('Vehicle info displayed');
            }

            // Display Finance Terms
            if (deal.financeTerms) {
                const terms = deal.financeTerms;
                const financeHtml = `
                    <div class="info-card">
                        <div class="info-label">Financing Type</div>
                        <div class="info-value">${terms.financingType || 'N/A'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Sale Price</div>
                        <div class="info-value currency">${formatCurrency(terms.salePrice)}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Down Payment</div>
                        <div class="info-value currency">${formatCurrency(terms.downPayment)}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Trade-In Allowance</div>
                        <div class="info-value currency">${formatCurrency(terms.tradeInAllowance || 0)}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Net Capitalized Cost</div>
                        <div class="info-value currency">${formatCurrency(terms.netCapitalizedCost)}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Term</div>
                        <div class="info-value">${terms.termMonths} months</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">APR</div>
                        <div class="info-value">${terms.apr}%</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Monthly Payment</div>
                        <div class="info-value currency">${formatCurrency(terms.monthlyPayment)}</div>
                    </div>
                `;
                document.getElementById('financeInfo').innerHTML = financeHtml;
                console.log('Finance info displayed');
            }

            // Display Protection Products
            console.log('Checking protection products:', deal.protectionProducts);
            if (deal.protectionProducts && deal.protectionProducts.length > 0) {
                const productsSection = document.getElementById('productsSection');
                productsSection.style.display = 'block';

                let productsHtml = '<div class="info-grid">';
                deal.protectionProducts.forEach((product, index) => {
                    console.log(`Displaying product ${index}:`, product);
                    productsHtml += `
                        <div class="info-card">
                            <div class="info-label">Product</div>
                            <div class="info-value">${product.productName}</div>
                            <div class="info-label" style="margin-top: 10px;">Provider</div>
                            <div class="info-value">${product.provider}</div>
                            <div class="info-label" style="margin-top: 10px;">Price</div>
                            <div class="info-value currency">${formatCurrency(product.price)}</div>
                        </div>
                    `;
                });
                productsHtml += '</div>';
                document.getElementById('productsInfo').innerHTML = productsHtml;
                console.log('Protection products displayed');
            } else {
                console.log('No protection products found');
                document.getElementById('productsSection').style.display = 'none';
            }
        }

        async function explainDeal() {
            const btn = document.getElementById('explainBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');

            // Validate configuration
            if (config.apiEndpoint.includes('YOUR_API_ID')) {
                showStatus('❌ Please configure your API Endpoint in localStorage or update the config', 'error');
                return;
            }

            // Disable button and show loading
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Analyzing...';

            try {
                // Load deal data
                const response = await fetch(config.dealJsonPath);
                const dealData = await response.json();

                // Show processing message
                showStatus('🔄 Sending your deal to AI for analysis... This may take a moment.', 'info');

                // Call Lambda function to analyze with Bedrock
                const apiResponse = await fetch(`${config.apiEndpoint}/analyze-deal`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        dealData: dealData,
                        s3Bucket: config.s3Bucket,
                    })
                });

                if (!apiResponse.ok) {
                    throw new Error(`API error: ${apiResponse.statusText}`);
                }

                const result = await apiResponse.json();

                if (result.success && result.explanation) {
                    // Display the explanation
                    displayExplanation(result.explanation);
                    showStatus('✅ Analysis complete!', 'success');
                } else {
                    throw new Error(result.error || 'Empty response from API');
                }

            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error('Error:', error);
            } finally {
                // Re-enable button
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = '✨ Explain My Deal';
            }
        }

        function displayExplanation(explanation) {
            const explanationSection = document.getElementById('explanationSection');
            const explanationContent = document.getElementById('explanationContent');

            // If explanation is HTML, display as is; otherwise wrap in paragraph
            if (explanation.includes('<')) {
                explanationContent.innerHTML = explanation;
            } else {
                explanationContent.innerHTML = `<p>${explanation}</p>`;
            }

            explanationSection.classList.add('show');

            // Scroll to explanation
            setTimeout(() => {
                explanationSection.scrollIntoView({ behavior: 'smooth' });
            }, 300);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message show ${type}`;

            // Auto-hide after 5 seconds if success
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.classList.remove('show');
                }, 5000);
            }
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2
            }).format(value);
        }
    </script>
</body>
</html>
