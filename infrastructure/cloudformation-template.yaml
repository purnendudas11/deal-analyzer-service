AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for Deal Structure Analyzer POC'

Parameters:
  S3BucketName:
    Type: String
    Default: deal-structure-bucket
    Description: Name of the S3 bucket for storing deal structures
  
  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

Outputs:
  S3BucketName:
    Value: !Ref DealStructureBucket
    Description: S3 Bucket for storing deal structures
  
  PresignedURLLambdaArn:
    Value: !GetAtt PresignedURLLambda.Arn
    Description: ARN of the Presigned URL Lambda function
  
  AnalyzeDealLambdaArn:
    Value: !GetAtt AnalyzeDealLambda.Arn
    Description: ARN of the Analyze Deal Lambda function
  
  ApiGatewayEndpoint:
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}'
    Description: API Gateway endpoint

Resources:
  # S3 Bucket for storing deal structures
  DealStructureBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${S3BucketName}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldUploads
            Status: Enabled
            Prefix: deals/
            ExpirationInDays: 30
      Tags:
        - Key: Application
          Value: DealAnalyzer
        - Key: Environment
          Value: !Ref EnvironmentName

  # IAM Role for Lambda functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deal-analyzer-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DealAnalyzerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObjectVersion
                Resource: !Sub '${DealStructureBucket.Arn}/*'
              - Sid: S3List
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                Resource: !GetAtt DealStructureBucket.Arn
              - Sid: BedrockAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: 'arn:aws:bedrock:*::foundation-model/*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'

  # Presigned URL Lambda Function
  PresignedURLLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: generate-presigned-url
      Runtime: python3.11
      Handler: presigned_url.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import boto3
          import logging
          from datetime import datetime
          from botocore.exceptions import ClientError
          
          s3_client = boto3.client('s3')
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event, context):
              try:
                  if isinstance(event.get('body'), str):
                      body = json.loads(event['body'])
                  else:
                      body = event.get('body', event)
                  
                  file_name = body.get('fileName')
                  content_type = body.get('contentType', 'application/json')
                  bucket = body.get('bucket')
                  
                  if not file_name or not bucket:
                      return error_response(400, "Missing fileName or bucket")
                  
                  url = s3_client.generate_presigned_url(
                      'put_object',
                      Params={
                          'Bucket': bucket,
                          'Key': file_name,
                          'ContentType': content_type
                      },
                      ExpiresIn=3600
                  )
                  
                  return success_response({
                      'presignedUrl': url,
                      'fileKey': file_name,
                      'bucket': bucket
                  })
              except Exception as e:
                  logger.error(f"Error: {str(e)}", exc_info=True)
                  return error_response(500, str(e))
          
          def success_response(data):
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({'success': True, 'data': data, 'timestamp': datetime.utcnow().isoformat()})
              }
          
          def error_response(status_code, message):
              return {
                  'statusCode': status_code,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({'success': False, 'error': message, 'timestamp': datetime.utcnow().isoformat()})
              }

  # Analyze Deal Lambda Function
  AnalyzeDealLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: analyze-deal-with-bedrock
      Runtime: python3.11
      Handler: analyze_deal.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          AWS_REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import json
          import boto3
          import logging
          from datetime import datetime
          from botocore.exceptions import ClientError
          
          s3_client = boto3.client('s3')
          bedrock_runtime = boto3.client('bedrock-runtime')
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          MODEL_ID = "anthropic.claude-3-sonnet-20240229-v1:0"
          
          def lambda_handler(event, context):
              try:
                  if isinstance(event.get('body'), str):
                      body = json.loads(event['body'])
                  else:
                      body = event.get('body', event)
                  
                  s3_key = body.get('s3Key')
                  s3_bucket = body.get('s3Bucket')
                  
                  if not s3_key or not s3_bucket:
                      return error_response(400, "Missing s3Key or s3Bucket")
                  
                  deal_structure = fetch_deal_from_s3(s3_bucket, s3_key)
                  explanation = analyze_deal_with_bedrock(deal_structure)
                  
                  return success_response(explanation)
              except Exception as e:
                  logger.error(f"Error: {str(e)}", exc_info=True)
                  return error_response(500, str(e))
          
          def fetch_deal_from_s3(bucket, key):
              response = s3_client.get_object(Bucket=bucket, Key=key)
              content = response['Body'].read().decode('utf-8')
              return json.loads(content)
          
          def analyze_deal_with_bedrock(deal_structure):
              prompt = create_analysis_prompt(deal_structure)
              response = bedrock_runtime.invoke_model(
                  modelId=MODEL_ID,
                  contentType="application/json",
                  accept="application/json",
                  body=json.dumps({
                      "anthropic_version": "bedrock-2023-06-01",
                      "max_tokens": 2000,
                      "messages": [{"role": "user", "content": prompt}]
                  })
              )
              response_body = json.loads(response['body'].read())
              return format_explanation(response_body['content'][0]['text'])
          
          def create_analysis_prompt(deal_structure):
              deal_str = json.dumps(deal_structure, indent=2)
              return f"""You are an expert auto finance analyst. Analyze the following auto finance deal and provide a clear explanation in simple English.
              
Deal Structure:
{deal_str}

Provide analysis covering: Deal Overview, Vehicle, Buyer, Financial Terms, Key Numbers, Monthly Commitment, and Deal Summary."""
          
          def format_explanation(text):
              html = text.replace('# ', '<h3>').replace('\n\n', '</h3><p>').replace('**', '<strong>').replace('\n', '<br>')
              return f"<p>{html}</p>"
          
          def success_response(data):
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({'success': True, 'explanation': data, 'timestamp': datetime.utcnow().isoformat()})
              }
          
          def error_response(status_code, message):
              return {
                  'statusCode': status_code,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({'success': False, 'error': message, 'timestamp': datetime.utcnow().isoformat()})
              }

  # API Gateway
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: deal-analyzer-api
      Description: API for Deal Structure Analyzer

  # Presigned URL Resource
  PresignedURLResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: presigned-url

  # Analyze Deal Resource
  AnalyzeDealResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: analyze-deal

  # Methods and Integrations
  PresignedURLMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref PresignedURLResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PresignedURLLambda.Arn}/invocations'

  AnalyzeDealMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref AnalyzeDealResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AnalyzeDealLambda.Arn}/invocations'

  # Lambda Permissions
  PresignedURLLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PresignedURLLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  AnalyzeDealLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalyzeDealLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PresignedURLMethod
      - AnalyzeDealMethod
    Properties:
      RestApiId: !Ref ApiGateway
      StageName: !Ref EnvironmentName
